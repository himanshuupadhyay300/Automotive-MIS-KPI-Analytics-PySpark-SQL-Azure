[project]
name = "automotive-mis-kpi-analytics"
version = "1.0.0"
description = "Automotive MIS and KPI analytics: PySpark, Delta Lake, star schema, SQL marts, Power BI-ready"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["delta: needs delta-spark + internet (RUN_DELTA_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
